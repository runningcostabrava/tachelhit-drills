name: Mobile builds

# Builds the Capacitor apps so iOS can be compiled without a Mac at hand:
#  - android: debug APK (installable on any device with "unknown sources")
#  - ios: Simulator build on GitHub's macOS runner (free: the repo is public).
#    Device/TestFlight builds still need signing — see frontend/IOS_SETUP.md §6.
on:
  push:
    branches: [main, 'feature/**']
    paths: ['frontend/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/mobile.yml']
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-36 build-tools;36.0.0" }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      # La mateixa signatura a tots els builds, perquè l'APK s'actualitzi al telèfon en comptes
      # de demanar desinstal·lar-lo —i desinstal·lar esborra les dades locals, el testimoni
      # d'usuari inclòs (#338). Es desa AL COSTAT DEL PROJECTE i no a la carpeta de l'usuari:
      # allà qui decidia quin fitxer feia servir era el plugin, i dos builds de dos dies van
      # sortir amb dues claus diferents. El fitxer el llegeix app/build.gradle pel seu nom.
      - name: Restore the shared debug keystore
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Sense ANDROID_DEBUG_KEYSTORE_B64 aquest APK va signat amb una clau nova i no pot actualitzar cap instal·lacio anterior (#338)."
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > android/app/debug.keystore
          ls -l android/app/debug.keystore
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      # Que cada build digui amb quina clau va signat. L'empremta no és cap secret, i és l'única
      # manera de veure que dos builds no quadren sense haver-ho de descobrir en un telèfon.
      - name: Say which key signed it
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -iE "certificate DN|SHA-256 digest"
      - uses: actions/upload-artifact@v4
        with:
          name: tachelhit-drills-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # cap sync runs `pod install` itself when ios/App/Podfile exists
      - run: npx cap sync ios
      - name: Build for the Simulator (no signing)
        run: |
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            build | xcpretty && exit ${PIPESTATUS[0]}
        working-directory: frontend/ios
      - name: Zip the .app
        run: cd ios/build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/App-simulator.zip" App.app
      # Runtime proof, not just a compile: boot a Simulator, install, launch, make sure the
      # process is still alive after the web app has had time to load, and keep screenshots.
      - name: Run it in the Simulator and take screenshots
        run: |
          set -euo pipefail
          APP=ios/build/Build/Products/Debug-iphonesimulator/App.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for os_, v in json.load(sys.stdin)["devices"].items() if "iOS" in os_ for d in v if d["isAvailable"] and "iPhone" in d["name"]]
          devs.sort(key=lambda d: (not d["name"].startswith("iPhone 16"), d["name"]))
          print(devs[0]["udid"]); print(devs[0]["name"], file=sys.stderr)')
          echo "simulator=$UDID bundle=$BUNDLE"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE"
          mkdir -p shots
          for t in 10 25 45; do
            sleep $(( t == 10 ? 10 : 15 ))
            xcrun simctl io "$UDID" screenshot "shots/home-after-${t}s.png"
          done
          # No pipe here on purpose: `launchctl list | grep -q` fails when it SUCCEEDS --
          # grep -q leaves as soon as it matches, launchctl gets a SIGPIPE, and under
          # `pipefail` that counts as the pipeline failing. The list goes to a file, which
          # is then searched and kept as an artefact.
          xcrun simctl spawn "$UDID" launchctl list > shots/launchctl.txt 2>&1 || true
          if ! grep -q "$BUNDLE" shots/launchctl.txt; then
            echo "::error::the app is not running 45 s after launch"
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "App"' --style compact | tail -200 || true
            exit 1
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "App" AND messageType >= error' --style compact | tail -100 > shots/app-errors.log || true
          echo "app still running after 45 s"
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tachelhit-drills-ios-screenshots
          path: frontend/shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tachelhit-drills-ios-simulator
          path: App-simulator.zip
          if-no-files-found: error

name: CI

# The tests that decide whether a pull request may be merged. Until this existed, every backend
# change merged with no check at all: `mobile.yml` only runs when `frontend/**` is touched, and
# nothing anywhere ran pytest. See docs/adr/0001 and the project skill.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Proves del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13, not the 3.14 this is developed on: the pins in requirements.txt target the
          # Python Render runs (see CLAUDE.md), and on 3.14 neither pydantic-core nor Pillow has a
          # Linux wheel — pip falls back to compiling and PyO3 0.22 stops at 3.13. So the checks
          # run closer to production than the laptop does.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instal·la les dependències
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-randomly pytest-subtests

      - name: pytest
        working-directory: backend
        # Random order on purpose (pytest-randomly): a test that only passes when it runs after
        # another one is a test that does not say what it means. Fixed in #191.
        # Fixing that test is its own issue; hiding it behind a random seed here would make the
        # suite lie about itself.
        run: python -m pytest tests -q
        env:
          LEXICON_WARMUP: '0'

  frontend:
    name: Tipus i compilació del web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instal·la les dependències
        working-directory: frontend
        run: npm ci

      - name: Tipus
        working-directory: frontend
        run: npx tsc -b

      - name: Compilació
        working-directory: frontend
        run: npm run build

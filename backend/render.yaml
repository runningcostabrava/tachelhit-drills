services:
  - type: web
    name: tachelhit-drills-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tachelhit-drills-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: HUGGINGFACE_SPACE_URL
        sync: false
      - key: HUGGINGFACE_IMAGE_SPACE_URL
        sync: false
      - key: HUGGINGFACE_ASR_SPACE_URL
        sync: false
      - key: HUGGINGFACE_TRANSLATION_SPACE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CHECK_SCHEMA
        sync: false
      # Cloudflare R2 (#577). Sense aquestes quatre, `/mitjans/<ruta>` contesta 404 i les
      # adreces reescrites no serveixen cap fitxer. `sync: false` vol dir que el valor es
      # posa al tauler de Render i no viu al dipositori.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: tachelhit-drills-db
    databaseName: tachelhit_drills
    user: tachelhit_user
    plan: free
